<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkTask</title>
  <link rel="icon" type="image/png" href="assets/logo-512.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <details class="menu">
      <summary class="menu-bouton" aria-label="Menu">
        <span class="menu-barre"></span>
        <span class="menu-barre"></span>
        <span class="menu-barre"></span>
      </summary>
      <nav class="menu-panneau">
        <a class="menu-lien" href="taches-realisees.html">Tâches réalisées</a>
      </nav>
    </details>
    <img class="app-logo" src="assets/logo-512.png" alt="Logo MarkTask">
    <h1 class="app-title">MarkTask</h1>
  </header>

  <main class="dashboard">

    <!-- Rangée haute : graphique (avec bouton Nouvelle tâche) / sociétés -->
    <div class="rangee rangee-haut">

      <section class="carte carte-graphique" aria-label="Graphique urgence importance">
        <button class="btn-principal" type="button" id="btn-nouvelle-tache">+ Nouvelle tâche</button>
        <div class="graphique">
          <span class="axe-label axe-y">Importance</span>
          <div class="graphique-zone" id="graphique-zone">
            <!-- les pins des tâches sont ajoutés ici par js/app.js -->
            <div class="fiche" id="fiche" hidden>
              <span class="fiche-nom" id="fiche-nom"></span>
              <span class="fiche-ligne">
                <span class="pastille" id="fiche-pastille"></span>
                <span id="fiche-societe"></span>
              </span>
              <p class="fiche-desc" id="fiche-desc"></p>
              <span class="fiche-ligne" id="fiche-deadline"></span>
              <span class="fiche-ligne" id="fiche-urgence"></span>
            </div>
          </div>
          <span class="axe-label axe-x">Urgence</span>
        </div>
      </section>

      <section class="carte carte-societes" aria-label="Sociétés">
        <input class="societes-repli-case" type="checkbox" id="societes-repli"
               aria-label="Masquer le panneau Sociétés">
        <label class="societes-toggle" for="societes-repli">
          <span class="chevron-lateral" aria-hidden="true"></span>
        </label>
        <div class="societes-contenu">
        <h2 class="carte-titre">Sociétés</h2>
        <div class="societes-filtres">
          <button class="btn-filtre" type="button" id="btn-tout-cocher">Tout cocher</button>
          <button class="btn-filtre" type="button" id="btn-tout-decocher">Tout décocher</button>
        </div>
        <ul class="liste-societes" id="liste-societes">
          <!-- rempli par js/app.js -->
        </ul>
        <button class="btn-secondaire" type="button" id="btn-nouvelle-societe">+ Nouvelle société</button>
        </div>
      </section>

    </div>

    <!-- Rangée basse : tâches à réaliser / tâches réalisées -->
    <div class="rangee rangee-bas">

      <details class="carte carte-repliable">
        <summary class="carte-titre-repliable">
          <span class="chevron" aria-hidden="true"></span>Tâches à réaliser
        </summary>
        <ul class="liste-taches" id="liste-taches">
          <!-- rempli par js/app.js -->
        </ul>
      </details>

    </div>

  </main>

  <dialog class="dialogue" id="dialogue-tache">
    <form id="formulaire-tache" novalidate>
      <h2 class="dialogue-titre">Nouvelle tâche</h2>
      <label class="champ">
        Nom de la tâche
        <input type="text" id="tache-nom" maxlength="80" autocomplete="off">
      </label>
      <label class="champ">
        Ce qui est à réaliser
        <textarea id="tache-desc" rows="3" maxlength="500"></textarea>
      </label>
      <label class="champ">
        Deadline
        <input type="date" id="tache-deadline">
      </label>
      <label class="champ">
        Société concernée
        <select id="tache-societe"></select>
      </label>
      <label class="champ">
        Importance : <output id="tache-importance-valeur">50</output>/100
        <input type="range" id="tache-importance" min="0" max="100" value="50">
      </label>
      <p class="dialogue-erreur" id="tache-erreur" hidden></p>
      <div class="dialogue-actions">
        <button class="btn-filtre" type="button" id="tache-annuler">Annuler</button>
        <button class="btn-principal" type="submit">Ajouter</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialogue" id="dialogue-societe">
    <form id="formulaire-societe" novalidate>
      <h2 class="dialogue-titre">Nouvelle société</h2>
      <label class="champ">
        Nom de la société
        <input type="text" id="societe-nom" maxlength="40" autocomplete="off">
      </label>
      <label class="champ champ-couleur">
        Couleur
        <input type="color" id="societe-couleur">
      </label>
      <p class="dialogue-erreur" id="societe-erreur" hidden></p>
      <div class="dialogue-actions">
        <button class="btn-filtre" type="button" id="societe-annuler">Annuler</button>
        <button class="btn-principal" type="submit">Ajouter</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
